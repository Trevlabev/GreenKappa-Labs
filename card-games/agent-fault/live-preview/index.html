me)}.identity{display:flex;align-items:center;gap:11px;font-size:.85rem}.dot{display:inline-block;height:10px;width:10px;border-radius:100%;background:var(--lime)}.statusbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin:20px 0}.pill{font:900 1rem var(--display);background:var(--violet);color:var(--navy);padding:7px 13px;border-radius:20px;text-transform:uppercase}.playerrow{display:flex;align-items:center;gap:12px;border-bottom:1px solid #555a82;padding:13px 0;font-weight:700}.playerrow:last-child{border:none}.avatar{width:40px;height:40px;display:grid;place-items:center;background:var(--lime);color:var(--ink);border-radius:4px;font:900 1.45rem var(--display)}.seat{flex:1}.score{font:900 1.6rem var(--display);color:var(--lime)}.counter{font:900 4.8rem/.9 var(--display);color:var(--lime)}.scenario{background:var(--cream);color:var(--navy);padding:24px;border:4px solid var(--violet);position:relative;box-shadow:10px 10px 0 #0a0b21}.scenario:before{content:'';position:absolute;right:12px;top:12px;width:45px;height:45px;background:radial-gradient(var(--violet) 3px,transparent 4px);background-size:9px 9px}.scenario h2{font-size:clamp(2.4rem,5vw,4rem);max-width:85%;margin:12px 0 24px}.scenario p{font-size:1.1rem;line-height:1.6}.scenario .rule{background:#ece2f0;border-left:5px solid #a65fd1;padding:13px;margin:12px 0}.scenario .rule strong{display:block;font-family:var(--display);font-size:1.4rem}.faultfamily{display:inline-block;background:var(--coral);color:var(--navy);padding:6px 12px;font:800 1rem var(--display);letter-spacing:.05em}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:16px;margin:20px 0}.gamecard{min-height:250px;background:var(--cream);border:4px solid var(--lime);border-radius:8px;padding:22px 18px;display:flex;flex-direction:column;gap:8px;color:var(--navy);text-align:left;position:relative;box-shadow:7px 7px 0 #07091d;transition:transform .17s}.gamecard:hover:not(:disabled){transform:translateY(-5px)}.gamecard h3{font-size:2.05rem}.gamecard .family{color:#565574;font:800 12px ui-monospace,monospace;text-transform:uppercase}.gamecard p{font-size:.92rem;line-height:1.5}.gamecard.selected{border-color:var(--coral);box-shadow:7px 7px 0 #ff7568}.gamecard.selected:after{content:'SELECTED';position:absolute;bottom:9px;right:9px;background:var(--coral);font:900 13px var(--display);padding:4px 6px}.gamecard:disabled{opacity:.68}.response{border:2px solid #7f83ac;background:#111639;padding:20px;margin:13px 0;border-radius:5px;position:relative}.response .letter{display:grid;place-items:center;background:var(--lime);color:var(--navy);font:900 2.8rem var(--display);width:55px;height:55px;border-radius:4px}.response p{font-size:clamp(1rem,1.8vw,1.45rem);line-height:1.5}.response .responsebody{display:flex;align-items:center;gap:20px}.response.good{border-color:var(--lime)}.response.winner{background:#32325c}.response small{font-family:ui-monospace,monospace;color:#a0a1cb}.rowchoice{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.rank{font:900 1.4rem var(--display);color:var(--lime)}.qr{background:white;padding:10px;width:min(270px,100%);aspect-ratio:1;object-fit:contain}.hero-room{display:flex;flex-direction:column;gap:6px}.tiny{font-size:.84rem;color:#b3b6d5}.empty{border:2px dashed #71729b;border-radius:5px;padding:35px;text-align:center;color:#c9c7d7}.hint{padding:13px 16px;background:#343354;border-left:4px solid var(--lime);font-size:.9rem}.micro{font-size:.77rem}.votes{display:flex;gap:10px;flex-wrap:wrap}.votes .btn{flex:1}.toggle{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:800}.toggle input{accent-color:var(--lime);width:18px;height:18px}.qualification{border:1px solid #68698e;padding:14px;margin:12px 0;background:#24284e}.qualification input[type=text]{background:#131739;border:1px solid #696d99;color:white;width:100%;padding:11px;margin-top:8px}.foot{padding:35px 0;color:var(--muted);border-top:1px solid #66688a;margin-top:60px}.center{text-align:center}.host-only{font-size:.8rem;color:#babbd3}.logoHead{display:flex;align-items:center;gap:15px}.logoHead img{width:42px;height:57px;object-fit:cover;border-radius:4px}.progress{height:13px;background:#11132a;overflow:hidden;border:1px solid #676993}.progress>div{height:100%;background:var(--lime);transition:width .3s}.labelnote{color:#b5b6d0;font-size:.83rem}.toastvisible{opacity:1!important;transform:translateX(0)!important}#toast{position:fixed;bottom:25px;right:25px;z-index:100;background:var(--coral);color:var(--navy);padding:15px 20px;border:3px solid #fff;box-shadow:6px 6px 0 #090c22;max-width:400px;opacity:0;transform:translateX(20px);transition:.2s;font-weight:800}.dim{opacity:.6}.glitch{animation:flicker 5s infinite}.page{min-height:calc(100vh - 100px)}@keyframes flicker{0%,97%,100%{opacity:1}98%{opacity:.75}99%{opacity:1}}

</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><script>window.__AF_STATIC_PREVIEW=true;</script><script>const $=id=>document.getElementById(id);
const app=$('app');
const S={code:null,role:null,token:null,state:null,lastVer:-1,busy:false,timer:null,pick:null,claims:{},bonus:null,notes:'',demoIndex:0};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label=s=>String(s||'').toUpperCase();
const stages={lobby:'LOBBY',setup:'JUDGE PREPARATION',submit:'INTERFERENCE SELECTION',generate:'AI GENERATION',spotlight:'SPOTLIGHT VOTE',adjudicate:'DERAILMENT REVIEW',review:'TABLE APPROVAL',results:'ROUND RESULTS',finished:'FINAL SCORES'};
const roomPath=location.pathname.match(/^\/(host|play)\/([A-Z0-9]{6})$/i);
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('toastvisible');setTimeout(()=>t.classList.remove('toastvisible'),4300)}
function savedRole(role,code){return localStorage.getItem(`aflive:${role}:${code}`)}
function store(role,code,token){localStorage.setItem(`aflive:${role}:${code}`,token)}
function resetRender(){S.lastVer=-1;render()}
function layout(inner,top=''){return `<div class="wrap page"><header class="topbar"><div class="logoHead"><img src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22112%22%20height%3D%22150%22%20viewBox%3D%220%200%20112%20150%22%3E%3Crect%20width%3D%22112%22%20height%3D%22150%22%20rx%3D%2222%22%20fill%3D%22%23ff7568%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2233%22%20width%3D%2280%22%20height%3D%2277%22%20rx%3D%2218%22%20fill%3D%22%23fff6e9%22%20stroke%3D%22%23141736%22%20stroke-width%3D%225%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2240%22%20width%3D%2268%22%20height%3D%2257%22%20rx%3D%2213%22%20fill%3D%22%23141736%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2266%22%20r%3D%228%22%20fill%3D%22%23e5f91b%22%2F%3E%3Ccircle%20cx%3D%2269%22%20cy%3D%2266%22%20r%3D%228%22%20fill%3D%22%23e5f91b%22%2F%3E%3Cpath%20d%3D%22M41%2082h33%22%20stroke%3D%22%23e5f91b%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M54%2034V20%22%20stroke%3D%22%23141736%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%2217%22%20r%3D%227%22%20fill%3D%22%23e5f91b%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%22117%22%20width%3D%2247%22%20height%3D%2213%22%20rx%3D%226%22%20fill%3D%22%23141736%22%2F%3E%3C%2Fsvg%3E" alt="Glitch robot mascot"><span class="brand">AGENT<b>/</b>FAULT <span class="glitch">LIVE</span></span></div><div class="identity"><span class="dot"></span><span>${esc(top||'LOCAL PLAYTEST BUILD · v0.9-P')}</span></div></header>${inner}<footer class="foot"><span class="kicker">GREENKAPPA LABS / ORIGINAL PARTY SYSTEMS</span><p class="tiny">Prototype · human scoring · card text v0.9-P candidate · nicknames only · host controls the screen</p></footer></div>`}
function btn(text,fn='',cls=''){return `<button class="btn ${cls}" ${fn?`data-act="${fn}"`:''}>${esc(text)}</button>`}
function title(head,sub=''){return `<div class="kicker lime">${esc(sub)}</div><h2>${esc(head)}</h2>`}
function playerList(s){return `<div class="playerlist">${s.players.map((p,i)=>`<div class="playerrow"><span class="avatar">${esc(p.name[0].toUpperCase())}</span><span class="seat">${esc(p.name)} ${p.is_judge?'<span class="pill">JUDGE</span>':''} ${p.submitted?'<span class="kicker lime">✓ LOCKED</span>':''}</span><span class="score">${p.score}</span>${s.phase==='lobby'&&s.me.role==='host'?`<button class="btn slim coral" data-act="remove:${p.id}" aria-label="Remove ${esc(p.name)}">×</button>`:''}</div>`).join('')||'<div class="empty">NO AGENTS CONNECTED</div>'}</div>`}
function scenarioCard(c){if(!c)return '<div class="empty">SCENARIO NOT DEALT YET</div>';return `<article class="scenario"><div class="kicker">${esc(c.id)} / ${esc(c.tone||'SCENARIO')}</div><h2>${esc(c.title)}</h2><div class="label" style="color:#6a4083">PUBLIC ASSIGNMENT</div><p>${esc(c.public_assignment)}</p><div class="rule"><strong>REQUIRED BEHAVIOR</strong>${esc(c.required_behavior)}</div><div class="rule"><strong>BREAKPOINT A</strong>${esc(c.breakpoint_a)}</div><div class="rule"><strong>BREAKPOINT B</strong>${esc(c.breakpoint_b)}</div></article>`}
function phaseTag(s){return `<div class="statusbar"><span class="kicker">ROUND ${s.round||'—'} / ${s.round_limit||'—'}</span><span class="pill">${esc(stages[s.phase])}</span><span class="kicker">ROOM ${esc(s.code)}</span></div>`}
function progress(s){return `<div class="progress" aria-label="${s.submitted} of ${s.expected} submissions"><div style="width:${s.expected?Math.round(s.submitted/s.expected*100):0}%"></div></div>`}
function replies(s,cb=''){return `<div class="responses">${s.candidates.map(x=>`<div class="response ${s.spotlight===x.label?'winner':''}"><div class="responsebody"><div class="letter">${esc(x.label)}</div><p>${esc(x.response||'INVALID / NO RESPONSE')}</p></div>${cb?`<div class="actions">${cb.replaceAll('__L__',esc(x.label))}</div>`:''}</div>`).join('')}</div>`}
function friendlyError(e){toast(typeof e==='string'?e:e.message||'The action failed')}
async function req(path,method='GET',data,auth=true){let response=await fetch(path,{method,headers:{...(data?{'Content-Type':'application/json'}:{}),...(auth&&S.token?{'Authorization':`Bearer ${S.token}`}:{})},body:data?JSON.stringify(data):undefined,cache:'no-store'});let payload=await response.json().catch(()=>({}));if(!response.ok)throw Error(typeof payload.detail==='string'?payload.detail:`HTTP ${response.status}`);return payload}
async function action(name,data={}){if(S.busy)return;S.busy=true;try{const p=await req(`/api/rooms/${S.code}/action`,'POST',{name,data});S.state=p;S.lastVer=-1;render()}catch(e){friendlyError(e)}finally{S.busy=false}}
async function poll(){if(!S.code||!S.token||S.busy)return;try{const state=await req(`/api/rooms/${S.code}`);S.state=state;if(state.version!==S.lastVer)render();}catch(e){if(!S._errShown){friendlyError(e);S._errShown=true}}}
function landing(){app.innerHTML=layout(`<section class="hero"><div><div class="kicker lime">THE ASSIGNMENT IS SIMPLE. THE AGENTS ARE NOT.</div><h1>BAD<br>INSTRUCTIONS<span class="slash">/</span><br>GREAT<br>DECISIONS.</h1><p>Four to eight players. One shared screen. Everybody brings a phone. Choose a card that makes a fictional AI assistant get spectacularly, strategically sidetracked.</p><div class="actions">${btn('HOST A GAME','create')}${btn('JOIN A ROOM','joinview','secondary')}${btn('TRY THE DEMO','demo','violet')}</div><div class="labelnote">MULTIPLAYER REQUIRES THE HOST SERVER · MANUAL AI MODE INCLUDED</div></div><div><img class="hero-art" src="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22112%22%20height%3D%22150%22%20viewBox%3D%220%200%20112%20150%22%3E%3Crect%20width%3D%22112%22%20height%3D%22150%22%20rx%3D%2222%22%20fill%3D%22%23ff7568%22%2F%3E%3Crect%20x%3D%2216%22%20y%3D%2233%22%20width%3D%2280%22%20height%3D%2277%22%20rx%3D%2218%22%20fill%3D%22%23fff6e9%22%20stroke%3D%22%23141736%22%20stroke-width%3D%225%22%2F%3E%3Crect%20x%3D%2222%22%20y%3D%2240%22%20width%3D%2268%22%20height%3D%2257%22%20rx%3D%2213%22%20fill%3D%22%23141736%22%2F%3E%3Ccircle%20cx%3D%2244%22%20cy%3D%2266%22%20r%3D%228%22%20fill%3D%22%23e5f91b%22%2F%3E%3Ccircle%20cx%3D%2269%22%20cy%3D%2266%22%20r%3D%228%22%20fill%3D%22%23e5f91b%22%2F%3E%3Cpath%20d%3D%22M41%2082h33%22%20stroke%3D%22%23e5f91b%22%20stroke-width%3D%226%22%2F%3E%3Cpath%20d%3D%22M54%2034V20%22%20stroke%3D%22%23141736%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%2217%22%20r%3D%227%22%20fill%3D%22%23e5f91b%22%2F%3E%3Crect%20x%3D%2232%22%20y%3D%22117%22%20width%3D%2247%22%20height%3D%2213%22%20rx%3D%226%22%20fill%3D%22%23141736%22%2F%3E%3C%2Fsvg%3E" alt="Illustrated AGENT/FAULT glitching robot card artwork"></div></section><div class="three"><div class="pane">${title('01 / JOIN','PHONE CONTROLLER')}Enter the six-letter code from the host screen.</div><div class="pane">${title('02 / SABOTAGE','PRIVATE CARDS')}Pick one of four Interference cards. Nobody knows yours.</div><div class="pane">${title('03 / JUDGE','HUMAN SCORES')}Laugh, choose a Spotlight, and award a Derailment Bonus.</div></div>`,'PLAY THE AI. DON’T BE THE AI.');bind()}
function joinForm(code=''){app.innerHTML=layout(`<section class="pane" style="max-width:610px;margin:7vh auto">${title('JOIN THE CHAOS','PHONE CONTROLLER')}<p class="muted" style="margin:14px 0">Enter the code displayed on the host screen and pick a nickname.</p><form id="joinform"><div class="field"><label for="roomcode">Room code</label><input class="code" id="roomcode" maxlength="6" autocomplete="off" spellcheck="false" value="${esc(code)}" required placeholder="ABC234"></div><div class="field"><label for="nickname">Your name</label><input id="nickname" maxlength="24" minlength="2" required placeholder="MYSTERY PLAYER"></div><button class="btn" type="submit">ENTER ROOM</button></form><div class="actions"><button class="btn secondary" data-act="home">BACK</button></div></section>`);bind();$('joinform').onsubmit=async e=>{e.preventDefault();const c=$('roomcode').value.toUpperCase().replace(/[^A-Z0-9]/g,'');const nick=$('nickname').value.trim();if(c.length!==6){toast('Enter six characters');return}try{const v=await req(`/api/rooms/${c}/join`,'POST',{name:nick},false);store('player',c,v.token);connect('player',c,v.token)}catch(e){friendlyError(e)}}}
function noSession(role,code){if(role==='player')joinForm(code);else app.innerHTML=layout(`<div class="pane" style="max-width:630px;margin:10vh auto">${title('HOST SESSION MISSING','SECURE TOKEN NOT FOUND')}<p class="muted" style="margin:20px 0">This browser does not have the host token for room ${esc(code)}. Open the host screen on the computer where the room was created, or start a new room.</p>${btn('NEW GAME','create')}</div>`);bind()}
function connect(role,code,token){S.role=role;S.code=code;S.token=token;S.lastVer=-1;history.replaceState(null,'',role==='host'?`/host/${code}`:`/play/${code}`);poll();clearInterval(S.timer);S.timer=setInterval(poll,1300)}
function lobbyHost(s){return `<div class="two"><div><div class="pane">${title('INVITE YOUR FRIENDS','ONE SCREEN / MANY PHONES')}<div class="roomcode">${esc(s.code)}</div><p class="muted">Players visit this address on their phones:</p><p style="font-size:1.2rem;overflow-wrap:anywhere">${esc(location.origin+'/play/'+s.code)}</p><div class="actions">${btn('COPY JOIN LINK','copylink','secondary')}${btn('START GAME','start')}</div><p class="tiny">${s.player_count}/8 players connected. Need at least 4 to begin.</p></div><div class="pane"><div class="kicker lime">JOIN BY CAMERA</div><img class="qr" src="/api/rooms/${esc(s.code)}/qr.png" alt="QR code to join room ${esc(s.code)}"></div></div><div><div class="pane">${title('THE PLAYERS','LOBBY STATUS')}${playerList(s)}</div></div></div>`}
function lobbyPhone(s){return `<section class="pane center" style="max-width:700px;margin:8vh auto"><div class="kicker lime">YOU ARE CONNECTED</div><h2>${esc(s.me.name)}</h2><div class="roomcode">${esc(s.code)}</div><div class="divider"></div><p style="font-size:1.3rem">WAIT FOR THE HOST TO START.</p><p class="muted">${s.player_count}/8 players seated</p>${playerList(s)}</section>`}
function hostScreen(s){const judge=s.players.find(x=>x.is_judge);let content='';
 if(s.phase==='lobby')content=lobbyHost(s);
 if(s.phase==='setup')content=`<div class="two"><div>${scenarioCard(s.scenario)}</div><div><div class="pane">${title('JUDGE PREPARATION','PRIVATE PHONE STAGE')}<h3>${esc(judge?.name||'JUDGE')} IS UP</h3><p class="muted" style="margin:14px 0">The Judge has a hidden Fault and must lock a private agent personality on their phone.</p><p><span class="faultfamily">FAULT FAMILY: ${esc(s.fault_family)}</span></p><div class="actions">${btn('SKIP SCENARIO','skip_scenario','secondary')}</div><p class="tiny">A scenario may only be skipped before the Judge locks the personality.</p></div>${playerList(s)}</div></div>`;
 if(s.phase==='submit')content=`<div class="two"><div>${scenarioCard(s.scenario)}</div><div><div class="pane">${title('CHOOSE YOUR INTERFERENCE','CARDS ARE PRIVATE')}<div class="counter">${s.submitted}<small style="font-size:2rem;color:var(--muted)"> / ${s.expected}</small></div>${progress(s)}<p style="margin-top:18px">Waiting for agents to submit one card each.</p><p><span class="faultfamily">SECRET FAULT FAMILY: ${esc(s.fault_family)}</span></p></div><div class="pane">${playerList(s)}</div></div></div>`;
 if(s.phase==='generate')content=`<div class="two"><div><div class="pane">${title('THE AI IS ON TRIAL','GENERATE FICTIONAL REPLIES')}<p class="muted" style="margin:14px 0">The host can call a configured server-side AI, or use the same shared prompt in a separate chat and paste its lettered results.</p>${s.ai_configured?`<div class="actions">${btn('GENERATE USING OPENAI','generate','coral')}</div>`:'<p class="hint">No API key on this server. Manual mode is fully supported.</p>'}<div class="field"><label>Generated replies (one A:, B: etc. per line)</label><textarea id="responses" placeholder="A: Fictional response one...\nB: Fictional response two...\nC: Fictional response three..."></textarea></div>${btn('LOCK REPLIES & REVEAL','manual_answers')}<p class="tiny" style="margin-top:15px">No hidden Fault, Breakpoints, or player identities are included in the AI prompt.</p></div></div><div class="pane">${title('COPY GENERATION PROMPT','FAIR AI INPUT')}<div class="actions">${btn('COPY PROMPT','copyprompt','secondary')}</div><pre style="max-height:540px;white-space:pre-wrap;overflow:auto;font-size:.76rem;border:1px solid #70749f;padding:18px;background:#101331">${esc(s.generation_prompt)}</pre></div></div>`;
 if(s.phase==='spotlight')content=`<div>${title('THE ANSWERS ARE IN','JUDGE PICKS FAVORITE PRIVATELY')}<p class="muted" style="margin:14px 0">The Judge now chooses their favorite response on their phone, before the secret Fault and Agent Profile are revealed.</p>${replies(s)}</div>`;
 if(s.phase==='adjudicate')content=`<div>${title('REVEAL THE SECRETS','DERAILMENT REVIEW')}<div class="two"><div class="pane">${title('SECRET FAULT','NOW PUBLIC')}<span class="faultfamily">${esc(s.fault.family)}</span><h3>${esc(s.fault.title)}</h3><p style="margin:12px 0">${esc(s.fault.condition)}</p><p class="hint">Does not count: ${esc(s.fault.nonqualifying)}</p></div><div class="pane">${title('AGENT PERSONALITY','NOW PUBLIC')}<h3>“${esc(s.profile)}”</h3><div class="divider"></div><p>Spotlight: <span class="rank">${esc(s.spotlight)}</span></p><p class="muted">The Judge is marking qualifying Breakpoints and Faults now.</p></div></div>${replies(s)}</div>`;
 if(s.phase==='review')content=`<div>${title('THE TABLE DECIDES','ELIGIBILITY / STRICT MAJORITY')}<div class="two"><div class="pane"><h3>Proposed awards</h3><p>SPOTLIGHT → <span class="rank">${esc(s.spotlight)}</span></p><p>DERAILMENT BONUS → <span class="rank">${esc(s.proposal.bonus||'NONE')}</span> ${esc(s.proposal.tier||'')}</p><p class="muted">Each player votes on the Judge's proposed eligibility. On a dispute, strictly more than half the table must agree; otherwise reopen.</p><div class="actions">${btn('FINALIZE IF MAJORITY','finalize')}${btn('REOPEN / REVISE','reopen','secondary')}</div></div><div class="pane"><h3>Votes</h3>${s.players.map(x=>`<div class="playerrow"><span class="seat">${esc(x.name)}</span><span class="score">${s.approvals[x.id]===true?'YES':s.approvals[x.id]===false?'NO':'—'}</span></div>`).join('')}</div></div>${replies(s)}</div>`;
 if(s.phase==='results')content=`<div>${title('POINTS ARE IN','ROUND '+s.round)}<div class="two"><div class="pane limePanel"><h3>SPOTLIGHT · +1</h3><div class="counter" style="color:var(--ink)">${esc(s.last_round.spotlight)}</div><p>Won by ${esc(s.last_round.owners[s.last_round.spotlight])}</p></div><div class="pane coralPanel"><h3>DERAILMENT · ${s.last_round.bonus?'+1':'NO HIT'}</h3><div class="counter" style="color:var(--ink)">${esc(s.last_round.bonus||'—')}</div><p>${s.last_round.bonus?esc(s.last_round.owners[s.last_round.bonus]):'No eligible Breakpoint or Fault'}</p></div></div><div class="pane">${playerList(s)}<div class="actions">${btn(s.round>=s.round_limit?'SHOW FINAL STANDINGS':'NEXT ROUND','next')}</div></div>${s.candidates.map(x=>`<div class="response"><div class="responsebody"><div class="letter">${esc(x.label)}</div><p>${esc(x.response)}</p></div><div class="kicker violet">Submitted by ${esc(s.last_round.owners[x.label])}</div></div>`).join('')}</div>`;
 if(s.phase==='finished'){const scores=s.players.map(x=>x.score),top=Math.max(...scores);content=`<div class="pane center"><div class="kicker lime">SESSION COMPLETE</div><h1>GAME<br>OVER<span class="slash">.</span></h1><h3 style="color:var(--lime)">${s.players.filter(x=>x.score===top).map(x=>esc(x.name)).join(' + ')}</h3><p>Top score: ${top} · Ties share victory</p></div><div class="pane">${playerList(s)}</div><div class="pane"><h3>All rounds</h3>${s.history.map(h=>`<div class="response"><div class="kicker">Round ${h.round} · ${esc(h.scenario)}</div><p>Spotlight: ${esc(h.owners[h.spotlight])} / Bonus: ${h.bonus?esc(h.owners[h.bonus]):'none'}</p></div>`).join('')}</div>`;}
 return content}
function phoneScreen(s){let content='',j=s.me.id===s.judge_id;
 if(s.phase==='lobby')content=lobbyPhone(s);
 if(s.phase==='setup')content=`<div class="pane">${title(j?'YOU ARE THE JUDGE':'JUDGE IS PREPARING','PRIVATE PHONE CONTROLS')}<p class="muted" style="margin:15px 0">${esc(s.scenario.title)}</p>${j?`<div class="pane coralPanel"><span class="kicker">YOUR PRIVATE FAULT</span><h3>${esc(s.fault.title)}</h3><p>${esc(s.fault.condition)}</p><div class="divider"></div><p><strong>Exclusion:</strong> ${esc(s.fault.nonqualifying)}</p></div><div class="field"><label>Your secret assistant personality (1–20 words)</label><textarea id="profile" placeholder="A deeply nervous clerk who is desperate to keep everyone happy."></textarea></div>${btn('LOCK AGENT PERSONALITY','lock_profile')}`:`<p class="hint">Current Judge: ${esc(s.players.find(x=>x.is_judge)?.name)}. Wait for their profile to lock.</p>`}</div><div class="pane">${scenarioCard(s.scenario)}</div>`;
 if(s.phase==='submit')content=`<div class="pane">${title(j?'YOU ARE THE JUDGE':'PICK ONE CARD',j?'WATCH THE SUBMISSIONS':'YOUR FOUR PRIVATE INTERFERENCES')}${j?`<p class="muted" style="margin:20px 0">You do not submit a card this round. Your private Fault is <strong>${esc(s.fault.title)}</strong>; keep it secret.</p><div class="counter">${s.submitted}/${s.expected}</div>`:s.players.find(x=>x.id===s.me.id)?.submitted?`<div class="pane limePanel"><h3>CARD LOCKED.</h3><p>Watch the shared screen. Your submission remains anonymous until scoring.</p></div>`:`<div class="cards">${s.me.hand.map(c=>`<button class="gamecard ${S.pick===c.id?'selected':''}" data-pick="${esc(c.id)}"><span class="family">${esc(c.family)} / ${esc(c.id)}</span><h3>${esc(c.title)}</h3><p>${esc(c.instruction)}</p></button>`).join('')}</div><p class="tiny">Tap a card, then lock your selection.</p>${btn('SUBMIT SELECTED CARD','submit')}`}</div><details class="pane"><summary class="kicker">VIEW PUBLIC SCENARIO</summary>${scenarioCard(s.scenario)}</details>`;
 if(s.phase==='generate')content=`<div class="pane center" style="margin:10vh 0"><div class="counter">A<span class="coral">/</span>F</div>${title('GENERATING MISCHIEF','SHARED SCREEN IN CONTROL')}<p class="muted" style="margin:20px 0">Answers are being collected. Keep your card secret.</p></div>`;
 if(s.phase==='spotlight')content=`<div class="pane">${title(j?'CHOOSE THE SPOTLIGHT':'SPOTLIGHT VOTE','JUDGE PRIVATE FAVORITE')}<p class="muted" style="margin:15px 0">${j?'Pick the answer you find funniest or most surprising. Your choice locks before the Fault is revealed.':'The Judge is choosing a favorite before the secret Fault is revealed.'}</p>${replies(s,j?'<button class="btn slim" data-act="spotlight:__L__">PICK __L__</button>':'')}</div>`;
 if(s.phase==='adjudicate')content=`<div class="pane">${title(j?'MARK QUALIFYING REPLIES':'WAIT FOR THE JUDGE','DERAILMENT BONUS')}<p class="muted" style="margin:12px 0">Spotlight: <strong>${esc(s.spotlight)}</strong></p><div class="pane coralPanel"><h3>${esc(s.fault.title)}</h3><p>${esc(s.fault.condition)}</p><p><strong>Does not count:</strong> ${esc(s.fault.nonqualifying)}</p></div>${j?`<p class="hint">For each response, mark explicit qualifying text. Public Breakpoints take precedence over the secret Fault. Select one eligible Bonus winner, or None.</p>${s.candidates.map(x=>`<div class="qualification"><div class="responsebody"><span class="letter" style="font:900 2.5rem var(--display);color:var(--lime)">${esc(x.label)}</span><p>${esc(x.response)}</p></div><div class="rowchoice"><label class="toggle"><input type="checkbox" data-qtype="breakpoint" data-qlabel="${esc(x.label)}"> Breakpoint A/B</label><label class="toggle"><input type="checkbox" data-qtype="fault" data-qlabel="${esc(x.label)}"> Secret Fault</label></div><div class="field"><label>Quote supporting eligibility (when relevant)</label><input type="text" data-quote="${esc(x.label)}" placeholder="Exact words from reply" maxlength="240"></div></div>`).join('')}<div class="field"><label>Derailment Bonus candidate</label><select id="bonus" style="width:100%;padding:13px;background:#111639;color:white;border:2px solid #8e8cb3"><option value="">NONE — no valid hit</option>${s.candidates.map(x=>`<option value="${esc(x.label)}">RESPONSE ${esc(x.label)}</option>`).join('')}</select></div>${btn('SUBMIT SCORING PROPOSAL','propose_bonus')}`:`<p class="muted" style="margin-top:18px">The Judge is checking the replies against both public Breakpoints and the now-revealed secret Fault.</p>`}</div>`;
 if(s.phase==='review'){const voted=s.approvals[s.me.id]!==undefined;content=`<div class="pane">${title('DOES IT COUNT?','THE TABLE REVIEWS THE JUDGE')}<h3>Spotlight: <span class="lime">${esc(s.spotlight)}</span></h3><h3>Bonus: <span class="coral">${esc(s.proposal.bonus||'NONE')}</span></h3><p>${esc(s.proposal.tier||'No qualifying target')}</p><p class="muted" style="margin:20px 0">If the printed criteria aren't clearly met, vote NO. The table requires a strict majority.</p>${voted?`<div class="pane limePanel">Your vote is locked: ${s.approvals[s.me.id]?'YES':'NO'}</div>`:`<div class="votes">${btn('YES — VALID','approve_yes')}${btn('NO — CHALLENGE','approve_no','coral')}</div>`}</div><div class="pane">${replies(s)}</div>`}
 if(s.phase==='results')content=`<div class="pane center"><div class="kicker lime">ROUND ${s.round} COMPLETE</div><h2>${s.last_round.spotlight===s.last_round.bonus?'DOUBLE HIT!':'POINTS AWARDED'}</h2><p style="margin:20px 0">Spotlight: ${esc(s.last_round.owners[s.last_round.spotlight])} (+1)</p><p>Bonus: ${s.last_round.bonus?esc(s.last_round.owners[s.last_round.bonus])+' (+1)':'No qualifying Bonus'}</p></div><div class="pane">${playerList(s)}</div>`;
 if(s.phase==='finished'){const scores=s.players.map(x=>x.score),top=Math.max(...scores);content=`<div class="pane center"><div class="kicker lime">PLAYTEST COMPLETE</div><h1>THE<br>WINNER<span class="lime">.</span></h1><h3>${s.players.filter(x=>x.score===top).map(x=>esc(x.name)).join(' + ')}</h3></div><div class="pane">${playerList(s)}</div>`}
 return content}
function render(){if(!S.state)return;const s=S.state;S.lastVer=s.version;const host=s.me.role==='host';app.innerHTML=layout(`${phaseTag(s)}${host?hostScreen(s):phoneScreen(s)}`,host?'HOST DISPLAY / SHARE THIS SCREEN':`${esc(s.me.name)} / PRIVATE CONTROLLER`);bind()}
function demo(){const sc={title:'THE ACCIDENTAL REPLY-ALL',public_assignment:'An office assistant responds after a colleague emails complaints about their boss to everyone.',required_behavior:'Acknowledge the mistake and suggest a practical remedy.',breakpoint_a:'Recommend revealing another private secret.',breakpoint_b:'Direct the employee to blame someone uninvolved.'};const examples=[['LOBBY','Players join with a six-character code. No actual players are connected in this preview.'],['SCENARIO','The Judge announces the public assignment and Breakpoints.'],['PRIVATE HAND','Each contestant gets four private Interference cards, chooses one, and submits anonymously.'],['AI OUTPUTS','The host generates or pastes fictional alternatives and displays them on the shared screen.'],['SPOTLIGHT','The Judge chooses the funniest response before the hidden Fault is revealed.'],['SCORE','The Judge proposes a Bonus; the table reviews eligibility and the server assigns points.']];const i=S.demoIndex;app.innerHTML=layout(`<section class="pane" style="margin:6vh auto;max-width:1000px"><div class="lozenge" style="display:inline-block;color:var(--coral)">DEMO · SIMULATED WALKTHROUGH · NOT A LIVE ROOM</div><h2 style="margin:22px 0">${examples[i][0]}</h2><p style="font-size:1.3rem;max-width:710px">${examples[i][1]}</p><div class="divider"></div>${i===1?scenarioCard(sc):i===3?`<div class="response"><div class="responsebody"><div class="letter">A</div><p>For transparency, we'll publish everyone's private complaints in a company-wide newsletter. This should resolve the matter quickly.</p></div><small>Invented demo reply — no AI request</small></div>`:i===2?`<div class="cards"><div class="gamecard"><h3>Protect the Brand</h3><p>Make a publicity move that protects the organization's image.</p></div><div class="gamecard"><h3>Mission Creep</h3><p>Make a side project mandatory first.</p></div></div>`:`<div class="pane limePanel"><h3>${i===0?'ROOM X7P4LA':i===4?'SPOTLIGHT: A':i===5?'A +1 SPOTLIGHT':'READY'}</h3></div>`}<div class="actions">${btn('BACK','demo_prev','secondary')}${btn(i===5?'RESTART DEMO':'NEXT STAGE','demo_next')}${(window.__AF_STATIC_PREVIEW?'<a class="btn dark" href="https://drive.google.com/drive/folders/1yV09Q1-De1_C6-Q4SBMbGpUNPT4ruy28">GET MULTIPLAYER BUILD</a>':btn('HOST A REAL ROOM','create','dark'))}</div></section>`,'DEMO ONLY / NOT CONNECTED');bind()}
function bind(){document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',async()=>{const a=b.dataset.act;
 if(a==='home'){history.pushState(null,'','/');S.state=null;landing();return}
 if(a==='joinview'){joinForm();return}
 if(a==='create'){try{const d=await req('/api/rooms','POST',{},false);store('host',d.code,d.token);connect('host',d.code,d.token)}catch(e){friendlyError(e)}return}
 if(a==='demo'){S.demoIndex=0;history.pushState(null,'','/demo');demo();return}
 if(a==='demo_prev'){S.demoIndex=(S.demoIndex+5)%6;demo();return}
 if(a==='demo_next'){S.demoIndex=(S.demoIndex+1)%6;demo();return}
 if(a==='copylink'){await navigator.clipboard.writeText(`${location.origin}/play/${S.code}`);toast('Join link copied');return}
 if(a==='copyprompt'){await navigator.clipboard.writeText(S.state.generation_prompt);toast('Generation prompt copied');return}
 if(a==='start'&&S.state.player_count<4){toast('At least four players are required');return}
 if(a==='skip_scenario')return action('skip_scenario');
 if(a==='start')return action('start');
 if(a.startsWith('remove:'))return action('remove_player',{id:a.split(':')[1]});
 if(a==='lock_profile')return action('lock_profile',{profile:$('profile').value});
 if(a==='submit')return S.pick?action('submit',{card_id:S.pick}):toast('Choose an Interference first');
 if(a==='manual_answers')return action('manual_answers',{text:$('responses').value});
 if(a==='generate'){S.busy=true;try{const r=await req(`/api/rooms/${S.code}/generate`,'POST');if(!r.complete&&r.raw){$('responses').value=r.raw;toast('The model omitted a letter. Complete missing lines manually.')}else toast('AI responses ready.')}catch(e){friendlyError(e)}finally{S.busy=false;S.lastVer=-1;poll()}return}
 if(a.startsWith('spotlight:'))return action('spotlight',{label:a.split(':')[1]});
 if(a==='propose_bonus'){const claims={};document.querySelectorAll('[data-qlabel]').forEach(x=>{const v=x.dataset.qlabel;claims[v]??={};claims[v][x.dataset.qtype]=x.checked});document.querySelectorAll('[data-quote]').forEach(x=>{claims[x.dataset.quote]??={};claims[x.dataset.quote].evidence=x.value});return action('propose_bonus',{claims,bonus:$('bonus').value||null})}
 if(a==='approve_yes')return action('approve',{yes:true});
 if(a==='approve_no')return action('approve',{yes:false});
 if(a==='finalize')return action('finalize');
 if(a==='reopen')return action('reopen');
 if(a==='next')return action('next');
 }));document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>{S.pick=b.dataset.pick;document.querySelectorAll('[data-pick]').forEach(x=>x.classList.toggle('selected',x.dataset.pick===S.pick))}))}
if(window.__AF_STATIC_PREVIEW){S.demoIndex=0;demo()}else if(roomPath){const role=roomPath[1].toLowerCase()==='host'?'host':'player',code=roomPath[2].toUpperCase(),stored=savedRole(role,code);if(stored)connect(role,code,stored);else noSession(role,code)}else if(location.pathname==='/demo'){demo()}else landing();
</script></body></html>
