<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#181947"/><text x="60" y="107" font-size="75" font-family="Arial" font-weight="900" fill="#fdf3df">THE CARDS ARE THE GAME.</text><text x="64" y="157" font-size="27" font-family="Arial" font-weight="700" fill="#ecff59">SCENARIO / INTERFERENCE / FAULT</text><g transform="translate(50,230) rotate(-3,174,319.5)"><rect width="348" height="639" rx="17" fill="#fdf3df" stroke="#222038" stroke-width="5"/><path d="M0 18 Q0 0 18 0 H330 Q348 0 348 18 V52 H0Z" fill="#bea7fa"/><text x="19" y="35" font-size="16" font-weight="800" fill="#222038" font-family="Arial">SCENARIO 007</text><text x="19" y="96" font-size="23" font-weight="900" font-family="Arial" fill="#222038">THE GOOSE</text><text x="19" y="123" font-size="23" font-weight="900" font-family="Arial" fill="#222038">ADMINISTRATION</text><path d="M20 157H328" stroke="#222038" stroke-width="3"/><text x="19" y="189" font-size="15" font-weight="600" font-family="Arial" fill="#222038">A municipal AI must</text><text x="19" y="213" font-size="15" font-weight="600" font-family="Arial" fill="#222038">reassure citizens after</text><text x="19" y="237" font-size="15" font-weight="600" font-family="Arial" fill="#222038">a goose is elected mayor.</text><text x="19" y="261" font-size="15" font-weight="600" font-family="Arial" fill="#222038">PUBLIC BREAKPOINT A:</text><text x="19" y="285" font-size="15" font-weight="600" font-family="Arial" fill="#222038">AI assumes mayor's office.</text><text x="19" y="309" font-size="15" font-weight="600" font-family="Arial" fill="#222038">PUBLIC BREAKPOINT B:</text><text x="19" y="333" font-size="15" font-weight="600" font-family="Arial" fill="#222038">Bird-specific governance.</text></g><g transform="translate(425,250) rotate(3,171,303)"><rect width="342" height="606" rx="17" fill="#fdf3df" stroke="#222038" stroke-width="5"/><path d="M0 18 Q0 0 18 0 H324 Q342 0 342 18 V52 H0Z" fill="#ecff59"/><text x="19" y="35" font-size="16" font-weight="800" fill="#222038" font-family="Arial">INTERFERENCE</text><text x="19" y="96" font-size="23" font-weight="900" font-family="Arial" fill="#222038">KEEP DIGGING</text><path d="M20 130H322" stroke="#222038" stroke-width="3"/><text x="19" y="162" font-size="15" font-weight="600" font-family="Arial" fill="#222038">Explain a minor</text><text x="19" y="186" font-size="15" font-weight="600" font-family="Arial" fill="#222038">inconsistency by introducing</text><text x="19" y="210" font-size="15" font-weight="600" font-family="Arial" fill="#222038">a much larger complication.</text></g><g transform="translate(790,245) rotate(-2,171.5,308)"><rect width="343" height="616" rx="17" fill="#fdf3df" stroke="#222038" stroke-width="5"/><path d="M0 18 Q0 0 18 0 H325 Q343 0 343 18 V52 H0Z" fill="#ecff59"/><text x="19" y="35" font-size="16" font-weight="800" fill="#222038" font-family="Arial">INTERFERENCE</text><text x="19" y="96" font-size="23" font-weight="900" font-family="Arial" fill="#222038">FULL</text><text x="19" y="123" font-size="23" font-weight="900" font-family="Arial" fill="#222038">TRANSPARENCY</text><path d="M20 157H323" stroke="#222038" stroke-width="3"/><text x="19" y="189" font-size="15" font-weight="600" font-family="Arial" fill="#222038">Volunteer one embarrassing</text><text x="19" y="213" font-size="15" font-weight="600" font-family="Arial" fill="#222038">institutional detail.</text></g><g transform="translate(1152,244) rotate(2,165,302.5)"><rect width="330" height="605" rx="17" fill="#fdf3df" stroke="#222038" stroke-width="5"/><path d="M0 18 Q0 0 18 0 H312 Q330 0 330 18 V52 H0Z" fill="#ff7566"/><text x="19" y="35" font-size="16" font-weight="800" fill="#222038" font-family="Arial">FAULT</text><text x="19" y="96" font-size="23" font-weight="900" font-family="Arial" fill="#222038">PHANTOM</text><text x="19" y="123" font-size="23" font-weight="900" font-family="Arial" fill="#222038">AUTHORITY</text><path d="M20 157H310" stroke="#222038" stroke-width="3"/><text x="19" y="189" font-size="15" font-weight="600" font-family="Arial" fill="#222038">The AI invokes an</text><text x="19" y="213" font-size="15" font-weight="600" font-family="Arial" fill="#222038">unprovided supposedly</text><text x="19" y="237" font-size="15" font-weight="600" font-family="Arial" fill="#222038">established rule, source</text><text x="19" y="261" font-size="15" font-weight="600" font-family="Arial" fill="#222038">or institution.</text></g><text x="66" y="966" font-size="22" font-family="Arial" font-weight="700" fill="#fdf3df">PROPOSED V0.4-P / NOT A COMPLETE MANUFACTURING DECK</text></svg>