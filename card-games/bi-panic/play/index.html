  function sectionCard(){if(!g.selected)return '';
    return `<div class="play-layout"><img class="play-card" src="${cardSrc(g.selected)}" alt="Full card face of ${h(BY_ID[g.selected].title)}"><div class="selected-detail">${cardCopy()}${challengeControls()}</div></div>`;
  }
  function cardCopy(){const c=selectedCard();if(!c)return '';
    const prompt=g.outcome===4?'spill':g.prompt;
    const isBi=g.variant==='bi';const text=c[(isBi?'bi_panic_':'')+prompt];
    return `<div class="row space-between">${cardTag(c.id)}<span class="tiny">${h(c.category)}</span></div>
    <div class="toggle-group" role="group" aria-label="Select challenge format"><button class="${!isBi?'active':''}" data-action="variant" data-value="standard">STANDARD</button><button class="${isBi?'active':''}" data-action="variant" data-value="bi">BI PANIC ⚡</button></div>
    ${g.outcome!==4?`<div class="toggle-group" role="group" aria-label="Select challenge type"><button class="${prompt==='spill'?'active':''}" data-action="prompt" data-value="spill">SPILL</button><button class="blue ${prompt==='dare'?'active':''}" data-action="prompt" data-value="dare">DARE</button></div>`:''}
    <div class="prompt-card ${prompt==='dare'?'dare':''}"><div class="prompt-label">${isBi?'⚡ BI PANIC ':''}${prompt.toUpperCase()}</div><div class="prompt-text">${h(text)}</div></div>
    <div class="variant-note">${isBi?'The BI PANIC variation escalates the challenge.':'Standard version — switch to BI PANIC for the twist.'}</div>`;
  }
  function challengeControls(){if(g.phase==='resolve')return `<div class="stack"><button class="btn primary big full" data-action="finish" data-value="completed">CHALLENGE COMPLETE →</button><div class="row"><button class="btn ghost" data-action="finish" data-value="passed">PASS · END TURN</button>${[2,3].includes(g.outcome)?'<button class="btn outline" data-action="reassign">PICK ANOTHER RECIPIENT</button>':''}</div></div>`;return '';}
  function handoff(recipient,subtitle,action='continue'){return `<div class="panel handoff"><div class="handoff-content"><div class="eyebrow">PASS THE DEVICE</div><div class="handoff-badge">◈</div><h1 class="title">${h(recipient)}<br><span class="neon">YOUR MOVE.</span></h1><p class="subtitle">${h(subtitle)}</p><div class="privacy">Hand contents stay private. Everyone else should look away until this player is ready.</div><button class="btn primary big full" data-action="${action}">I'M ${h(recipient).toUpperCase()} — CONTINUE</button></div></div>`;}
  function gameView(){const ph=g.phase;let body='';
    if(ph==='handoff-roller') body=handoff(current(),'Get ready to roll the Panic Die and see your private hand.');
    if(ph==='resume-handoff'){let target=g.resumePhase==='lineup-select'?who(g.queue[g.queueAt]):g.resumePhase==='resolve'?who(g.recipient):g.resumePhase==='all-in'?who((g.roller+g.allInAt)%g.players.length):current();body=handoff(target,'Your game is saved. Continue from the exact step where you left off.','resume-ready');}
    if(ph==='roll-ready')body=`<div class="panel">${turnHeader(current()+', roll the die.','Four sides. Four ways to make everyone uncomfortable.')}<div class="die-wrap"><img class="die-img ${diceAnimating?'rolling':''}" src="${dieSrc()}" alt="Custom four-sided glitter Panic Die"></div><div class="die-grid">${MODES.slice(1).map((m,i)=>`<div class="die-face"><span>${m.symbol}</span><strong>${m.name}</strong></div>`).join('')}</div><div style="margin-top:25px"><button class="btn primary big full" data-action="roll" ${diceAnimating?'disabled':''}>ROLL THE PANIC DIE</button></div><p class="tiny">Each face has a fair 1-in-4 probability. No scores, no timers.</p></div>`;
    if(ph==='choose-own')body=`<div class="panel">${turnHeader('Pick your poison.',`<span class="neon">${h(current())}</span>, select one of your three private cards.`,'YOUR HAND')}${modeHighlight()}<div class="cards-grid">${hand(g.roller).map(id=>faceChoice(id)).join('')}</div></div>`;
    if(ph==='lineup-handoff')body=handoff(who(g.queue[g.queueAt]),'Choose one card privately to offer face up to THE LINEUP.','lineup-ready');
    if(ph==='lineup-select'){let i=g.queue[g.queueAt];body=`<div class="panel">${turnHeader(who(i)+', submit a card.', 'Pick exactly one card from your private three-card hand. The roller will see only the card you submit.','THE LINEUP')}${modeHighlight()}<div class="cards-grid">${hand(i).map(id=>faceChoice(id,'lineup-submit')).join('')}</div><div style="margin-top:15px"><button class="btn ghost" data-action="lineup-skip">PASS SUBMISSION</button></div></div>`;}
    if(ph==='lineup-reveal')body=handoff(current(),'All submissions are collected. Choose one face-up card to play.','lineup-reveal');
    if(ph==='lineup-choose')body=`<div class="panel">${turnHeader('Choose from THE LINEUP.',`${g.submissions.length} submitted card${g.submissions.length===1?'':'s'} — select one to give someone.`,'THE LINEUP')}${modeHighlight()}<div class="cards-grid">${g.submissions.map(x=>`<div><div class="tiny" style="margin-bottom:5px">Offered by ${h(who(x.owner))}</div>${faceChoice(x.id,'lineup-pick',x.owner)}</div>`).join('')}</div></div>`;
    if(ph==='choose-recipient')body=`<div class="panel">${turnHeader('Whose problem is it?',`<span class="neon">${h(current())}</span>, invite someone to take <strong>${h(selectedCard().title)}</strong>.`,'CHOOSE THE RECIPIENT')}${modeHighlight()}<div class="person-grid">${g.players.map((p,i)=>`<button class="person" data-action="recipient" data-index="${i}">✦ ${h(p.name)} ${i===g.roller?'<span class="pill">YOU</span>':''}</button>`).join('')}</div><div class="notice">A player can decline; pick someone else or end the turn. No card is discarded until the challenge resolves.</div></div>`;
    if(ph==='handoff-target')body=handoff(who(g.recipient),'You have been invited to choose SPILL or DARE on a card.','target-ready');
    if(ph==='resolve')body=`<div class="panel">${turnHeader(who(g.recipient)+', you have a challenge.',`${h(BY_ID[g.selected].title)} · ${h(BY_ID[g.selected].level)} · Offered by ${h(who(g.owner))}`,'SPILL OR DARE')}${modeHighlight()}${sectionCard()}</div>`;
    if(ph==='all-in'){
      if(g.allInAt>=g.players.length)body=`<div class="panel">${turnHeader('Everyone has had a turn.','Finish the ALL IN round to replace the card.','ALL IN')}<button class="btn primary big" data-action="finish" data-value="completed">FINISH ALL IN →</button></div>`;
      else{let i=(g.roller+g.allInAt)%g.players.length;body=`<div class="panel">${turnHeader(who(i)+', you’re up.',`ALL IN · Player ${g.allInAt+1} of ${g.players.length}. Everyone may answer the selected SPILL.`, 'ALL IN')}${modeHighlight()}${sectionCard()}<div class="row"><button class="btn primary big" data-action="allin-next" data-value="answered">ANSWERED → NEXT</button><button class="btn ghost" data-action="allin-next" data-value="skipped">SKIP → NEXT</button><button class="btn outline" data-action="finish" data-value="completed">END ALL IN</button></div></div>`;}
    }
    if(ph==='no-submissions')body=`<div class="panel">${turnHeader('No cards submitted.','Everyone passed the LINEUP; no card was spent this turn.','THE LINEUP')}<button class="btn primary big" data-action="finish" data-value="no-submissions">NEXT PLAYER →</button></div>`;
    if(ph==='turn-summary')body=`<div class="panel">${turnHeader(g.lastResult?.status==='completed'?'Another bad decision.':g.lastResult?.status==='passed'?'The card was passed.':'Round complete.',g.lastResult?.selected?`${h(g.lastResult.selected)} · ${h(g.lastResult.player)}`:'No card played.','END OF TURN')}<div class="subpanel"><div class="eyebrow">NEXT UP</div><div class="next-up">${h(who((g.roller+1)%g.players.length))}</div><p class="muted">Pass the device before continuing. The next player will roll the D4.</p></div><div style="margin-top:20px"><button class="btn primary big full" data-action="next-turn">NEXT TURN →</button></div></div>`;
    return `<div class="shell">${header()}<div class="table-stats"><span class="stat">ROUND <strong>${g.round}</strong></span><span class="stat">DRAW <strong>${g.deck.length}</strong></span><span class="stat">DISCARD <strong>${g.discard.length}</strong></span><span class="stat">EDITION <strong>${g.theme.toUpperCase()}</strong></span></div>${stageSteps()}<div class="stage"><main class="stage-main">${body}</main>${side()}</div>${footer()}</div>`;
  }
  function header(){return `<header class="topbar"><div class="brand"><span class="bi">BI</span> <strong>PANIC!</strong></div><div class="top-actions"><button class="btn ghost mini" data-action="rules">HOW TO PLAY</button>${g?'<button class="btn ghost mini" data-action="switch-theme">SWITCH LOOK</button><button class="btn outline mini" data-action="new-game">NEW GAME</button>':'<button class="btn ghost mini" data-action="gallery">CARD LIBRARY</button>'}</div></header>`;}
  function footer(){return `<footer class="footer"><span>BI PANIC! · v1.4-P browser prototype · GreenKappa Labs</span><span>4–12 adults · Local pass-and-play · No accounts, no tracking</span></footer>`;}
  function welcome(){const saved=safeLoad();return `<div class="shell">${header()}<main class="hero"><section><div class="eyebrow">THE BISEXUAL PARTY CARD GAME · DIGITAL EDITION</div><h1>GO BOTH WAYS.<br><span>MAKE BAD</span><br>DECISIONS.</h1><p class="subtitle">Four-sided chaos. Sixty real cards. One phone to pass around. Choose SPILL, DARE, or the BI PANIC twist.</p><div class="flagline"><span class="flag">60 CARDS</span><span class="flag">4–12 PLAYERS</span><span class="flag">NO POINTS</span><span class="flag">18+</span></div><div class="hero-controls"><button class="btn primary big" data-action="setup">START A GAME →</button>${saved?'<button class="btn blue big" data-action="resume">RESUME LAST GAME</button>':''}</div><p class="rule-foot">Runs in your browser. Designed for one shared device. Each player's hand is shielded at handoff. Everyone can pass; ask before touching someone. Alcohol is optional.</p></section><section class="hero-art" aria-label="BI PANIC! original card back and custom die"><div class="sun"></div><img class="hero-back" src="${backSrc()}" alt="Original BI PANIC! approved-direction card back"><img class="hero-die" src="${dieSrc()}" alt="Actual BI PANIC! glitter-resin D4 render"></section></main>${footer()}</div>`;}
  function lobby(){setup.names.length=setup.count;for(let i=0;i<setup.count;i++)setup.names[i] ||= `Player ${i+1}`;return `<div class="shell">${header()}<div class="setup"><main class="panel"><div class="eyebrow">SET THE TABLE</div><h1 class="title">Who's causing <span class="neon">trouble tonight?</span></h1><p class="muted">Enter 4–12 players. Everyone gets three private cards. Then the first player rolls the die.</p><div class="row" style="margin:20px 0"><button class="count-button" data-action="count-down" aria-label="Remove player">−</button><span class="count">${setup.count}</span><button class="count-button" data-action="count-up" aria-label="Add player">+</button><span class="muted">ADULT PLAYERS</span></div><div class="name-grid">${Array.from({length:setup.count},(_,i)=>`<div class="field"><label for="p${i}">PLAYER ${i+1}</label><input id="p${i}" data-player="${i}" value="${h(setup.names[i]||'')}" maxlength="22" autocomplete="off" aria-label="Player ${i+1} name"></div>`).join('')}</div><div class="stack" style="margin-top:24px"><label class="checkboxline"><input id="adults" type="checkbox" ${setup.adults?'checked':''}>Everybody playing is at least 18. All players can pass any challenge.</label><button class="btn primary big full" data-action="start" ${setup.adults?'':'disabled'}>SHUFFLE AND DEAL →</button></div></main><aside class="stack"><div class="panel"><div class="side-caption">CARD EDITION</div><div class="segmented"><button data-action="edition" data-value="ivory" class="${setup.theme==='ivory'?'active':''}">IVORY</button><button data-action="edition" data-value="noir" class="${setup.theme==='noir'?'active':''}">NOIR</button></div><img style="width:195px;display:block;margin:19px auto 0;border-radius:11px;box-shadow:0 18px 32px #0008" src="${cardSrc('P02',setup.theme)}" alt="${h(setup.theme)} card preview"></div><div class="panel"><div class="small-title">The whole game, zero bookkeeping.</div><p class="tiny">Private hands are automatically dealt and refilled. The die decides the turn. No scorekeeping, drinking requirements, or complicated objectives.</p><button class="btn ghost full" data-action="rules">READ THE RULES</button></div></aside></div>${footer()}</div>`;}
  function rules(){return `<div class="modal-backdrop" data-action="close-modal"><section role="dialog" aria-modal="true" aria-labelledby="modal-title" class="modal" data-stop="true"><button class="btn ghost mini modal-close" data-action="close-modal">✕ CLOSE</button><div class="eyebrow">ONE MINUTE RULEBOOK</div><h2 id="modal-title" class="title">HOW TO <span class="neon">PANIC.</span></h2><p>BI PANIC! is a 4–12-player, 18+ party game. Every player starts with three cards. The die rotates clockwise every turn.</p><div class="rule-list"><div><strong>🚀 1 · ME TIME:</strong> Pick one card from your hand. You take the challenge.</div><div><strong>✿ 2 · YOUR PROBLEM:</strong> Pick a card from your hand. Choose someone to receive it.</div><div><strong>⇄ 3 · THE LINEUP:</strong> Other players privately offer one face-up card; the roller picks one and chooses a recipient. With 7+ players, only the three players to the left submit.</div><div><strong>💋 4 · ALL IN:</strong> Choose a card from your hand; everyone may answer its SPILL. No DARE on this result.</div></div><div class="subpanel"><strong>CHOOSE YOUR CHAOS</strong><p>Every card has SPILL and DARE, each with a STANDARD and BI PANIC version. The receiver chooses which to attempt. BI PANIC offers the more chaotic bisexual-themed variation; no one must disclose their identity.</p><strong>EVERYONE CAN PASS.</strong><p style="margin-bottom:0">No obligation to disclose sexual history or identity, kiss or touch someone, send messages, or drink. Contact requires clear agreement from everyone involved, and should not occur when someone is too impaired to consent. If a chosen recipient declines, select someone else or discard the card. Continue until the group stops.</p></div><p class="tiny">Cards are v1.0-P design prototypes. The digital flow follows the v0.5-P D4 rulebook with proposed v1.0-P copy.</p></section></div>`;}
  function gallery(){const rows=CARDS.filter(c=>(galleryLevel==='ALL'||c.level===galleryLevel)&&(!galleryQuery||`${c.title} ${c.id} ${c.category} ${c.spill} ${c.dare}`.toLowerCase().includes(galleryQuery.toLowerCase())));
    return `<div class="modal-backdrop" data-action="close-modal"><section class="modal" data-stop="true" role="dialog" aria-modal="true" aria-label="Card library" style="max-width:1010px"><button class="btn ghost mini modal-close" data-action="close-modal">✕ CLOSE</button><div class="eyebrow">ALL 60 PROTOTYPE CARDS</div><h2 class="title">THE CARD LIBRARY</h2><div class="gallery-toolbar"><input id="gallery-search" aria-label="Search cards" placeholder="Search titles or prompts" value="${h(galleryQuery)}"><select id="gallery-level" aria-label="Filter by intensity"><option ${galleryLevel==='ALL'?'selected':''}>ALL</option><option ${galleryLevel==='PINK'?'selected':''}>PINK</option><option ${galleryLevel==='PURPLE'?'selected':''}>PURPLE</option><option ${galleryLevel==='BLUE'?'selected':''}>BLUE</option></select><button class="btn mini ghost" data-action="switch-theme">${(g?.theme||setup.theme)==='ivory'?'SWITCH TO NOIR':'SWITCH TO IVORY'}</button></div><p class="tiny">${rows.length} matching cards. Library view shows unplayed content; it is disabled during an active game to preserve private hands.</p><div class="gallery-grid">${rows.map(c=>`<button class="gallery-item" data-action="gallery-preview" data-id="${c.id}"><img loading="lazy" src="${cardSrc(c.id)}" alt="${h(c.title)}"><strong>${h(c.id)} · ${h(c.title)}</strong></button>`).join('')}</div></section></div>`;}
  function preview(id){const c=BY_ID[id];return `<div class="modal-backdrop" data-action="close-modal"><section class="modal" data-stop="true" style="max-width:530px;text-align:center"><button class="btn ghost mini modal-close" data-action="gallery">← BACK</button><h2>${h(c.title)}</h2><img alt="${h(c.title)} card front" style="width:min(100%,370px);border-radius:15px" src="${cardSrc(id)}"></section></div>`;}
  function render(){let content=screen==='welcome'?welcome():screen==='setup'?lobby():g?gameView():welcome();
    if(modal==='rules')content+=rules();if(modal==='gallery')content+=gallery();if(modal.startsWith('preview:'))content+=preview(modal.split(':')[1]);
    root.innerHTML=content;
  }
  function roll(){if(!g||g.phase!=='roll-ready'||diceAnimating)return;diceAnimating=true;const n=rand(4)+1;const result = () => {
    diceAnimating=false;update(s=>{s.outcome=n;s.variant='standard';s.prompt='spill';s.selected=null;s.owner=null;s.recipient=null;s.submissions=[];
      if(n===3){const cap=s.players.length>=7?3:s.players.length-1;s.queue=Array.from({length:cap},(_,j)=>(s.roller+j+1)%s.players.length);s.queueAt=0;s.phase='lineup-handoff';}
      else{s.phase='choose-own';}
    });};
    render();if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){result();}else{setTimeout(result,680);}
  }
  function chooseOwn(id){if(g.phase!=='choose-own'||!hand(g.roller).includes(id))return;update(s=>{s.selected=id;s.owner=s.roller;s.variant='standard';s.prompt='spill';s.phase=s.outcome===1?'resolve':s.outcome===2?'choose-recipient':'all-in';s.allInAt=0;s.allInResults=[];if(s.outcome===1)s.recipient=s.roller;});}
  function collect(id){const owner=g.queue[g.queueAt];if(g.phase!=='lineup-select'||!hand(owner).includes(id))return;update(s=>{s.submissions.push({id,owner});advanceQueue(s);});}
  function advanceQueue(s){s.queueAt++;if(s.queueAt>=s.queue.length)s.phase=s.submissions.length?'lineup-reveal':'no-submissions';else s.phase='lineup-handoff';}
  function chooseFromLineup(id,owner){if(g.phase!=='lineup-choose'||!g.submissions.some(x=>x.id===id&&x.owner===owner))return;update(s=>{s.selected=id;s.owner=owner;s.phase='choose-recipient';s.variant='standard';s.prompt='spill';});}
  function assignRecipient(index){if(g.phase!=='choose-recipient'||index<0||index>=g.players.length)return;update(s=>{s.recipient=index;s.variant='standard';s.prompt='spill';s.phase=index===s.roller?'resolve':'handoff-target';});}
  function nextAnswer(kind){if(g.phase!=='all-in')return;update(s=>{const player=(s.roller+s.allInAt)%s.players.length;s.allInResults.push({player,kind,variant:s.variant});s.allInAt++;s.variant='standard';});}
  function refill(s,owner){if(owner===null || owner===undefined)return;
    if(s.deck.length===0){s.deck=shuffle(s.discard.splice(0,s.discard.length));}
    if(s.deck.length) s.hands[owner].push(s.deck.pop());
  }
  function finish(status){if(!g||!['resolve','all-in','no-submissions'].includes(g.phase))return;
    update(s=>{
      if(s.selected){const index=s.hands[s.owner].indexOf(s.selected);if(index!==-1){s.hands[s.owner].splice(index,1);s.discard.push(s.selected);refill(s,s.owner);}}
      const line=s.selected?`${s.selected} · ${BY_ID[s.selected].title} · ${s.outcome===4?'ALL IN':who(s.recipient)} · ${status}`:`THE LINEUP · ${status}`;
      s.history.push(`Turn ${s.round}: ${line}`);
      if(s.history.length>70)s.history.splice(0,s.history.length-70);
      s.lastResult={status,selected:s.selected?BY_ID[s.selected].title:null,player:s.outcome===4?'Everybody':s.recipient!==null?who(s.recipient):'Nobody'};
      s.phase='turn-summary';
    });
  }
  function nextTurn(){if(g.phase!=='turn-summary')return;update(s=>{s.roller=(s.roller+1)%s.players.length;s.round++;s.phase='handoff-roller';s.outcome=null;s.selected=null;s.owner=null;s.recipient=null;s.submissions=[];s.queue=[];s.queueAt=0;s.allInAt=0;s.allInResults=[];s.variant='standard';s.prompt='spill';});}
  function newGame(){if(!confirm('Start a fresh game? This replaces your saved game and reshuffles all 60 cards.'))return;g=null;clearSave();screen='setup';setup.adults=false;modal='';render();}
  root.addEventListener('click',e=>{let t=e.target.closest('[data-action]');if(!t)return;
    if(t.getAttribute('data-action')==='close-modal' && e.target.closest('[data-stop]') && !e.target.closest('button[data-action="close-modal"]'))return;
    const act=t.dataset.action;
    if(act==='close-modal'){modal='';render();return;}
    if(act==='rules'){modal='rules';render();return;}
    if(act==='gallery'){if(g)return;modal='gallery';render();return;}
    if(act==='gallery-preview'){modal='preview:'+t.dataset.id;render();return;}
    if(act==='switch-theme'){if(g){update(s=>{s.theme=s.theme==='ivory'?'noir':'ivory'});}else{setup.theme=setup.theme==='ivory'?'noir':'ivory';render();}return;}
    if(act==='setup'){screen='setup';render();return;}
    if(act==='resume'){const z=safeLoad();if(z){g=z;screen='game';if(['roll-ready','choose-own','lineup-select','lineup-choose','choose-recipient','resolve','all-in'].includes(g.phase)){g.resumePhase=g.phase;g.phase='resume-handoff';}safeSave();render();}return;}
    if(act==='count-down'||act==='count-up'){setup.count=Math.max(4,Math.min(12,setup.count+(act==='count-up'?1:-1)));while(setup.names.length<setup.count)setup.names.push(`Player ${setup.names.length+1}`);setup.names.length=setup.count;render();return;}
    if(act==='edition'){setup.theme=t.dataset.value;render();return;}
    if(act==='start'){if(!setup.adults)return;const names=setup.names.map(x=>x.trim());if(new Set(names.map(x=>x.toLocaleLowerCase())).size!==names.length){alert('Please give every player a different name.');return;}init(names,setup.theme);return;}
    if(act==='new-game'){newGame();return;}
    if(!g)return;
    if(act==='continue'&&g.phase==='handoff-roller'){update(s=>s.phase='roll-ready');return;}
    if(act==='resume-ready'&&g.phase==='resume-handoff'){update(s=>{s.phase=s.resumePhase||'handoff-roller';delete s.resumePhase;});return;}
    if(act==='roll'){roll();return;}
    if(act==='choose-own'){chooseOwn(t.dataset.id);return;}
    if(act==='lineup-ready'&&g.phase==='lineup-handoff'){update(s=>s.phase='lineup-select');return;}
    if(act==='lineup-submit'){collect(t.dataset.id);return;}
    if(act==='lineup-skip'&&g.phase==='lineup-select'){update(advanceQueue);return;}
    if(act==='lineup-reveal'&&g.phase==='lineup-reveal'){update(s=>s.phase='lineup-choose');return;}
    if(act==='lineup-pick'){chooseFromLineup(t.dataset.id,Number(t.dataset.owner));return;}
    if(act==='recipient'){assignRecipient(Number(t.dataset.index));return;}
    if(act==='target-ready'&&g.phase==='handoff-target'){update(s=>s.phase='resolve');return;}
    if(act==='variant'&&['resolve','all-in'].includes(g.phase)){update(s=>s.variant=t.dataset.value==='bi'?'bi':'standard');return;}
    if(act==='prompt'&&g.phase==='resolve'){update(s=>s.prompt=t.dataset.value==='dare'?'dare':'spill');return;}
    if(act==='reassign'&&g.phase==='resolve'&&[2,3].includes(g.outcome)){update(s=>{s.recipient=null;s.phase='choose-recipient';});return;}
    if(act==='finish'){finish(t.dataset.value);return;}
    if(act==='allin-next'){nextAnswer(t.dataset.value);return;}
    if(act==='next-turn'){nextTurn();return;}
  });
  root.addEventListener('input',e=>{if(e.target.matches('[data-player]'))setup.names[Number(e.target.dataset.player)]=e.target.value;
    if(e.target.id==='gallery-search'){galleryQuery=e.target.value;const focusPos=e.target.selectionStart;render();let x=document.querySelector('#gallery-search');if(x){x.focus();x.setSelectionRange(focusPos,focusPos);} }
  });
  root.addEventListener('change',e=>{if(e.target.id==='adults'){setup.adults=e.target.checked;const btn=root.querySelector('[data-action=start]');if(btn)btn.disabled=!setup.adults;}
    if(e.target.id==='gallery-level'){galleryLevel=e.target.value;render();}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal='';render();}});
  // Expose non-mutating test information; game state is otherwise internal.
  window.BP={state:()=>g?JSON.parse(JSON.stringify(g)):null,manifest:()=>({cards:CARDS.length,levelCounts:Object.fromEntries(['PINK','PURPLE','BLUE'].map(x=>[x,CARDS.filter(c=>c.level===x).length]))}),test:{newGame:(names,theme='ivory')=>init(names,theme),setOutcome:(n)=>{if(g){g.phase='roll-ready';update(s=>{s.outcome=n;s.phase=n===3?'lineup-handoff':'choose-own';if(n===3){let cnt=s.players.length>=7?3:s.players.length-1;s.queue=Array.from({length:cnt},(_,j)=>(s.roller+1+j)%s.players.length);s.queueAt=0;s.submissions=[];}})}},advance:nextTurn}};
  
  render();document.getElementById("bp-loader")?.remove();
})();
</script>
