name: AGENT/FAULT Cloudflare dual-worker validation

on:
  pull_request:
    paths:
      - 'card-games/agent-fault/game-app/cloudflare/**'
      - 'card-games/agent-fault/game-app/hosted/**'
      - 'card-games/agent-fault/game-app/cascade/**'
      - '.github/workflows/agent-fault-cloudflare-workers-qa.yml'
  workflow_dispatch:

concurrency:
  group: agent-fault-cloudflare-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        edition: [hosted, cascade]
    defaults:
      run:
        working-directory: card-games/agent-fault/game-app/${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Rebuild card data and run game/UI tests
        run: npm run build
      - name: Check Cloudflare source syntax
        run: npm run cloudflare:check
      - name: Bundle Cloudflare Worker and validate Durable Object configuration (no deploy)
        run: npm run cloudflare:dry-run
      - name: Exercise local Worker, multiplayer rooms and WebSockets (no deployment)
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/agent-fault-worker.log 2>&1 &
          worker_pid=$!
          trap 'kill "$worker_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/agent-fault-worker.log
            exit 1
          fi
          node ../cloudflare/smoke.mjs http://127.0.0.1:8787 ${{ matrix.edition }}
