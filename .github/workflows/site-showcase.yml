name: GreenKappa homepage and Tools visuals
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'assets/**'
      - 'sitemap.xml'
      - 'arcana-config.js'
      - 'arcana-widget.js'
      - 'card-games/**'
      - '!card-games/agent-fault/game-app/**'
      - 'tablearc/**'
      - 'tablearc-red/**'
      - 'worlds/**'
      - 'playground/**'
      - 'tools/**'
      - 'flowglass/**'
      - 'filingproof/**'
      - 'courtflow/**'
      - 'work/**'
      - 'journal/**'
      - 'tests/site-showcase.mjs'
      - 'tests/site-navigation.mjs'
      - 'tests/site-integrity.mjs'
      - '.github/workflows/site-showcase.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'script.js'
      - 'styles.css'
      - 'assets/**'
      - 'sitemap.xml'
      - 'arcana-config.js'
      - 'arcana-widget.js'
      - 'card-games/**'
      - '!card-games/agent-fault/game-app/**'
      - 'tablearc/**'
      - 'tablearc-red/**'
      - 'worlds/**'
      - 'playground/**'
      - 'tools/**'
      - 'flowglass/**'
      - 'filingproof/**'
      - 'courtflow/**'
      - 'work/**'
      - 'journal/**'
      - 'tests/site-showcase.mjs'
      - 'tests/site-navigation.mjs'
      - 'tests/site-integrity.mjs'
      - '.github/workflows/site-showcase.yml'
  workflow_dispatch:

concurrency:
  group: site-showcase-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Fast, deterministic checks still run on applicable pushes and pull requests.
# The full Playwright/Chromium suite is intentionally manual to avoid
# costly, flaky browser runs on routine artwork and content changes.
jobs:
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public pages, local resources, links and sitemap
        run: node tests/site-integrity.mjs

  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit public pages, local resources, links and sitemap
        run: node tests/site-integrity.mjs
      - name: Install browser testing dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Exercise homepage gallery, Tools, and Flowglass at desktop and mobile sizes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/greenkappa-site.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          timeout --signal=TERM --kill-after=20s 7m node tests/site-showcase.mjs
          timeout --signal=TERM --kill-after=20s 7m node tests/site-navigation.mjs
