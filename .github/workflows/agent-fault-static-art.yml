name: AGENT/FAULT restore same-origin approved card artwork
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent-fault-static-art.yml'
      - 'card-games/agent-fault/game-app/hosted/assets/digital-full-*.part'
      - 'card-games/agent-fault/game-app/hosted/scripts/prepare-digital.mjs'
permissions:
  contents: write
concurrency:
  group: agent-fault-static-art
  cancel-in-progress: false
jobs:
  restore-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SHA-256 archive and restore exact illustrated deck
        run: node card-games/agent-fault/game-app/hosted/scripts/prepare-digital.mjs
      - name: Copy approved 66 fronts and 3 category backs to published website
        shell: bash
        run: |
          set -euo pipefail
          src=card-games/agent-fault/game-app/hosted/public/static/assets
          dst=card-games/agent-fault/assets
          mkdir -p "$dst"
          cp -R "$src/fronts" "$dst/"
          cp -R "$src/backs" "$dst/"
          cp "$src/manifest.json" "$dst/manifest.json"
          test "$(find "$dst/fronts" -maxdepth 1 -name '*.webp' | wc -l)" -eq 66
          test "$(find "$dst/backs" -maxdepth 1 -name '*.webp' | wc -l)" -eq 3
      - name: Commit binary artwork assets to repository main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add card-games/agent-fault/assets/fronts card-games/agent-fault/assets/backs card-games/agent-fault/assets/manifest.json
          if git diff --cached --quiet; then
            echo "Published card artwork already up to date."
          else
            git commit -m "assets(agent-fault): publish 66 approved fronts and three backs on same origin"
            git push origin HEAD:main
          fi
