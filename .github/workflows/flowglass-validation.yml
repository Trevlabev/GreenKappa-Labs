name: Flowglass validation
on:
  push:
    paths:
      - "flowglass/**"
      - ".github/workflows/flowglass-validation.yml"
  pull_request:
    paths:
      - "flowglass/**"
      - ".github/workflows/flowglass-validation.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: |
          node --check flowglass/core.mjs
          node --check flowglass/examples.mjs
          node --check flowglass/app.mjs
      - name: Run deterministic graph tests
        run: node --test flowglass/tests/core.test.mjs

  browser:
    # Run the full browser suite only via Actions > Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install headless Chromium
        run: npx playwright install chromium --with-deps
      - name: Run real-browser smoke tests
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/flowglass-server.log 2>&1 &
          sleep 2
          node flowglass/tests/browser-smoke.mjs
