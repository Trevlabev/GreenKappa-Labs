name: Flowglass validation
on:
  push:
    paths:
      - "flowglass/**"
      - ".github/workflows/flowglass-validation.yml"
  pull_request:
    paths:
      - "flowglass/**"
      - ".github/workflows/flowglass-validation.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: |
          node --check flowglass/core.mjs
          node --check flowglass/examples.mjs
          node --check flowglass/app.mjs
      - name: Run deterministic graph tests
        run: node --test flowglass/tests/core.test.mjs
