name: AGENT-FAULT Cascade — isolated playtest deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'card-games/agent-fault/game-app/cascade/**'
      - '.github/workflows/agent-fault-cascade-deploy.yml'

permissions:
  contents: read

concurrency:
  group: agent-fault-cascade-playtest
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: card-games/agent-fault/game-app/cascade
    env:
      NETLIFY_SITE_ID: 1f19b647-8097-4c8d-a1de-8966cc071e7d
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN || secrets.NETLIFY_API_TOKEN || secrets.NETLIFY_TOKEN }}
    steps:
      - name: Check out the independent Cascade source copy
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Restore SHA-256 pinned 66-card art and corrected backs
        run: node scripts/prepare-digital.mjs
      - name: Validate the Cascade game engine, UI and demo
        run: |
          npm test
          npm run check
      - name: Verify deployment token
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo '::error title=Netlify authentication needed::Set repository secret NETLIFY_AUTH_TOKEN.'
            exit 1
          fi
      - name: Deploy isolated Cascade to new Netlify project
        run: |
          npx --yes netlify-cli@latest deploy --prod --build \
            --site "$NETLIFY_SITE_ID" \
            --auth "$NETLIFY_AUTH_TOKEN" \
            --dir public \
            --functions netlify/functions
      - name: Verify production API, demo and original card artwork
        run: |
          python3 - <<'PY'
          import json,time,urllib.request,sys
          base='https://agent-fault-cascade-playtest.netlify.app'
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base+'/api/health',timeout=18) as r:
                      data=json.load(r)
                  assert data['edition']=='cascade-v0.2-P' and data['mode']=='netlify-db'
                  assert data['cards']=={'Scenario':24,'Interference':36,'Fault':6}
                  with urllib.request.urlopen(base+'/demo',timeout=18) as r: assert r.status==200
                  with urllib.request.urlopen(base+'/static/assets/fronts/AF-SCN-001.webp',timeout=18) as r:
                      assert r.status==200 and r.headers.get('Content-Type','').startswith('image/')
                  print('Cascade HTTP health, full art source and demo OK:',data)
                  sys.exit(0)
              except Exception as e:print('Attempt',attempt+1,type(e).__name__,str(e)[:140])
              time.sleep(5)
          raise SystemExit('Public Cascade deployment could not be verified')
          PY
