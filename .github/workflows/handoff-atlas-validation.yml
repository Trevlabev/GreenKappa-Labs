name: Handoff Atlas validation
on:
  push:
    paths:
      - "tools/handoff-atlas/**"
      - "tools/index.html"
      - ".github/workflows/handoff-atlas-validation.yml"
  pull_request:
    paths:
      - "tools/handoff-atlas/**"
      - ".github/workflows/handoff-atlas-validation.yml"
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check module syntax
        run: |
          node --check tools/handoff-atlas/core.mjs
          node --check tools/handoff-atlas/sample.mjs
          node --check tools/handoff-atlas/app.mjs
          node --check tools/handoff-atlas/tests/core.test.mjs
      - name: Run deterministic core engine tests
        run: node --test tools/handoff-atlas/tests/core.test.mjs
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Exercise application in Chromium and mobile viewport
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/handoff-atlas-server.log 2>&1 &
          sleep 2
          node tools/handoff-atlas/tests/browser-smoke.mjs
